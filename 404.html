<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | OKARA</title>
    <style>
        body {
            font-family: serif;
            margin: 0;
            padding: 0;
            background-color: #fcfbf9;
            color: #222;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: space-between;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 2rem 4rem;
            border-bottom: 1px solid #eae6df;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: bold;
            letter-spacing: 0.2rem;
            text-transform: uppercase;
            text-decoration: none;
            color: #222;
        }
        .error-content {
            text-align: center;
            padding: 4rem 2rem;
            max-width: 600px;
            margin: auto;
        }
        .error-content h1 {
            font-size: 4rem;
            font-weight: normal;
            margin-bottom: 1rem;
            color: #555;
        }
        .error-content p {
            font-size: 1.1rem;
            color: #666;
            margin-bottom: 2rem;
        }
        .btn {
            display: inline-block;
            padding: 0.8rem 2rem;
            border: 1px solid #222;
            text-decoration: none;
            color: #222;
            text-transform: uppercase;
            letter-spacing: 0.1rem;
            font-size: 0.9rem;
            transition: background 0.2s, color 0.2s;
        }
        .btn:hover {
            background-color: #222;
            color: #fff;
        }
        footer {
            padding: 2rem 4rem;
            text-align: center;
            border-top: 1px solid #eae6df;
            font-size: 0.85rem;
            color: #888;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">Okara</a>
    </header>

    <div class="error-content">
        <h1>404</h1>
        <p>The page you are looking for does not exist or has been moved.</p>
        <a href="index.html" class="btn">Return Home</a>
    </div>

    <footer>
        &copy; Okara Art Portfolio 2026. All rights reserved.
    </footer>

</body>
</html>
